<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172421">
<title>Setas Soltas</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#172421;color:#f3f0df;--sub:#b6c5b6;--line:#394b43;--accent:#daf58a}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#263a32,transparent 550px),#172421}
main{width:min(100% - 32px,520px);margin:auto;padding:max(22px,env(safe-area-inset-top)) 0 max(22px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;gap:8px;flex-wrap:wrap}header h1{margin-right:auto}#mode[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
h1{font:normal clamp(32px,8vw,46px)/1 Georgia,serif;letter-spacing:-.065em;margin:0}h1 em{color:var(--accent)}
button{font:inherit;font-weight:650;cursor:pointer;color:inherit;border:1px solid #53665b;background:#263a32;border-radius:13px;min-height:44px;padding:0 14px;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stats{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;color:var(--sub);font-size:.92rem}.stats strong{color:#f3f0df}
#hearts{letter-spacing:.19em;color:#ffad9c;font-size:1.2rem}
progress{appearance:none;width:100%;height:5px;display:block;border:0;border-radius:6px;overflow:hidden;background:#394b43;margin-bottom:16px}progress::-webkit-progress-bar{background:#394b43}progress::-webkit-progress-value{background:var(--accent)}progress::-moz-progress-bar{background:var(--accent)}
.board{background:#101c19;border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;aspect-ratio:1}
svg{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;width:100%;height:100%;display:block;touch-action:manipulation}
.arrow{cursor:pointer;outline:none}.arrow .ink{stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;fill:none}.arrow:focus-visible .ink,.arrow.hint .ink{filter:drop-shadow(0 0 5px currentColor);stroke:#fff8d9}.arrow.blocked .ink{stroke:#ff8b77}
.result{position:absolute;inset:0;background:#101c19e8;display:grid;place-content:center;text-align:center;gap:14px;padding:16px}.result[hidden]{display:none}.result h2{font:normal 34px Georgia,serif;margin:0}.result button[hidden]{display:none}.result #retry{background:#263a32;color:#f3f0df;border:1px solid #53665b}.result button{background:var(--accent);color:#172421;border:0}
#message{min-height:2.6em;margin:12px 0 8px;color:var(--sub);font-size:.93rem}.controls{display:flex;gap:10px}.controls button{flex:1}

.board-scroll{width:100%;aspect-ratio:1;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.board-scroll svg{height:auto;aspect-ratio:1;max-width:none}
#startScreen{z-index:4}
.result{z-index:2}
.zoom-controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}
.zoom-controls button{min-width:44px;padding:0 10px}
#zoomValue{min-width:3.5em;text-align:center;font-variant-numeric:tabular-nums}
.immersive main,:fullscreen main{width:min(100% - 16px,650px);padding-top:max(10px,env(safe-area-inset-top))}
#confetti{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;left:var(--left);top:var(--top);width:var(--width);height:var(--height);background:var(--color);border-radius:2px;opacity:0;animation:celebrate var(--time) ease-out var(--delay) both}
.win-mark{justify-self:center;display:grid;place-items:center;width:68px;height:68px;border-radius:50%;font-size:38px;color:#172421;background:#daf58a;box-shadow:0 0 32px #daf58555}.win-mark[hidden]{display:none}
.result.is-win{background:radial-gradient(ellipse at 50% 42%,#344c34f7,#101c19f5 72%)}
#roundSummary{margin:0;color:var(--sub);font-size:.95rem}
.result.celebrating .win-mark{animation:win-pop .66s cubic-bezier(.17,.85,.27,1.3)}
@keyframes win-pop{from{transform:scale(.25) rotate(-25deg);opacity:.2}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes celebrate{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}65%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--spin))}}
@media(prefers-reduced-motion:reduce){#confetti{display:none}.result.celebrating .win-mark{animation:none}}
.run-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px;color:var(--sub);font-size:.85rem}
.run-tools strong{color:var(--accent)}
#treasurePanel p{margin:0;color:var(--sub)}
.board[data-power="ghost"]{border-color:#bb83ff;box-shadow:0 0 18px #bb83ff55}
.board[data-power="shield"]{border-color:#88decc;box-shadow:0 0 18px #88decc55}
#chainStatus{color:#ffe58a}
.arrow.chain-ready .ink{stroke:#ffe58a;filter:drop-shadow(0 0 8px #ffce47)}
.board[data-power="ghost"] .arrow:not(.chain-ready) .ink{filter:drop-shadow(0 0 2px #bb83ff)}
.board[data-power="shield"] .arrow:not(.chain-ready) .ink{filter:drop-shadow(0 0 2px #88decc)}
.arrow.ghost-flight .ink{stroke:#d7b7ff;filter:drop-shadow(0 0 9px #c288ff)}
.arrow.chain-flight .ink{stroke:#ffe58a;filter:drop-shadow(0 0 7px #ffce47)}
.arrow.ghost-flight .ink.depth,.arrow.chain-flight .ink.depth{filter:none}
.board.blast{animation:blast .48s ease-out}
@keyframes blast{20%{box-shadow:inset 0 0 70px #ffda83,0 0 26px #ffda83}65%{box-shadow:inset 0 0 30px #ffb59a}}
@media(prefers-reduced-motion:reduce){.board.blast{animation:none}}
</style>
</head>
<body>
<main>
<header><h1>Setas <em>Soltas</em></h1><button id="mode" type="button" aria-pressed="false">Extremo</button><button id="restart" type="button">Recomeçar</button></header>
<div class="stats"><strong id="level"></strong><span id="count"></span><span id="hearts" role="img"></span></div>
<div class="run-tools"><strong id="score"></strong><span id="combo"></span><span id="record"></span><span id="nextPower"></span><strong id="chainStatus" hidden></strong></div>
<progress id="progress" aria-label="Progresso da fase"></progress>
<section class="board" aria-label="Tabuleiro">
<div id="boardScroll" class="board-scroll"><svg id="board" aria-label="Setas do tabuleiro"></svg></div>
<div id="treasurePanel" class="result" hidden role="dialog" aria-labelledby="treasureTitle">
<h2 id="treasureTitle">Baú encontrado</h2><p>Pode limpar a fase ou acabar com a partida.</p>
<button id="openTreasure" type="button">Abrir baú</button><button id="skipTreasure" type="button">Seguir jogando</button>
</div>
<div id="confetti" aria-hidden="true"></div>
<div class="result" id="startScreen"><button id="start" type="button">Jogar em tela cheia</button></div>
<div class="result" id="result" hidden><div id="winMark" class="win-mark" aria-hidden="true" hidden>★</div><h2 id="resultTitle"></h2><p id="roundSummary" hidden></p><button id="continue" type="button"></button></div>
</section>
<div class="zoom-controls" aria-label="Zoom do tabuleiro">
<button id="zoomOut" type="button" aria-label="Diminuir zoom">−</button><output id="zoomValue">100%</output><button id="zoomIn" type="button" aria-label="Aumentar zoom">+</button>
</div>
<div class="run-tools" aria-label="Poderes">
<strong id="powerStatus" hidden></strong>
<button id="viewTreasure" type="button" hidden>Baú encontrado</button>
</div>
<p id="message" role="status"></p>
<div class="controls"><button id="guide" type="button" aria-pressed="false">Ver direções</button><button id="hint" type="button">Dica</button></div>
</main>
<script>
const directions = [[1,0],[0,1],[-1,0],[0,-1]];
const directionNames = ['direita','baixo','esquerda','cima'];
const colors = ['#daf58a','#88decc','#ffb59a','#dbc0fa','#ffda83'];
const key = (x,y) => x + ',' + y;
const inside = (x,y,size) => x >= 0 && y >= 0 && x < size && y < size;

function firstObstacle(cells, direction, occupied, size) {
  const [dx,dy] = directions[direction];
  const [x,y] = cells.at(-1);
  for (let a=x+dx,b=y+dy; inside(a,b,size); a+=dx,b+=dy) {
    if (occupied.has(key(a,b))) return [a,b];
  }
  return null;
}

function exitClear(cells,direction,occupied,size) {
  return firstObstacle(cells,direction,occupied,size) === null;
}

const figures = [
  ['Coração', [
    '.###...###.', '#####.#####', '###########', '###########', '.#########.',
    '.#########.', '..#######..', '...#####...', '....###....', '.....#.....'
  ]],
  ['Foguete', [
    '.....#.....', '....###....', '....###....', '...#####...', '...#####...',
    '...#####...', '..#######..', '.#########.', '####.#.####', '##..###..##',
    '....###....', '.....#.....'
  ]],
  ['Borboleta', [
    '##.........##', '####.....####', '#####...#####', '######.######',
    '.###########.', '..#########..', '.###########.', '.#####.#####.',
    '..###...###..', '...#.....#...'
  ]],
  ['Gato', [
    '.#.......#.', '.##.....##.', '.###...###.', '.#########.',
    '###########', '###########', '###########', '.#########.',
    '..#######..', '...#####...'
  ]],
  ['Peixe', [
    '.....###.....', '...#######...', '..#########.#', '.############',
    '#############', '.############', '..#########.#', '...#######...',
    '.....###.....'
  ]]
];

function octopusMask(size) {
  const arms = [
    [[39,47],[28,48],[15,40],[8,43],[9,51]],
    [[37,53],[22,57],[9,62],[8,71],[16,73]],
    [[40,56],[31,68],[20,75],[21,86],[29,88]],
    [[46,58],[42,74],[34,84],[38,94],[46,90]],
    [[53,58],[55,74],[63,88],[58,95]],
    [[59,55],[66,68],[76,77],[76,88],[69,89]],
    [[62,52],[76,57],[89,63],[91,72],[83,74]],
    [[64,45],[76,46],[86,38],[93,40],[94,49]]
  ];
  const cells = [];
  for (let y=0;y<size;y++) for (let x=0;x<size;x++) {
    const u = 100*(x+.5)/size;
    const v = 100*(y+.5)/size;
    const inHead = ((u-51)/23)**2 + ((v-33)/28)**2 <= 1;
    const inArm = arms.some((arm,armIndex) => arm.slice(1).some(([bx,by],index) => {
      const [ax,ay] = arm[index];
      const dx = bx-ax, dy = by-ay;
      const along = Math.max(0,Math.min(1,((u-ax)*dx+(v-ay)*dy)/(dx*dx+dy*dy)));
      const radius = (armIndex === 3 || armIndex === 4 ? 5.5 : 5) - 2.1*(index+along)/(arm.length-1);
      return (u-ax-along*dx)**2 + (v-ay-along*dy)**2 <= radius**2;
    }));
    if (inHead || inArm) cells.push([x,y]);
  }
  return cells;
}

function generate(level,extreme=false,layout=1) {
  const [,pixels] = figures[(level-1) % figures.length];
  const width = pixels[0].length;
  const originalSize = Math.max(width,pixels.length);
  const size = layout === 1
    ? (extreme ? 46 : Math.min(22,originalSize + 2*Math.floor((level-1)/5)))
    : (extreme ? Math.min(66,36+3*(level-1)) : Math.min(34,13+2*Math.floor((level-1)/2)));
  // Keep legacy boards reproducible for existing saved arrow IDs.
  const progressiveSize = layout === 3
    ? (extreme ? Math.min(66,36+3*(level-1)) : Math.min(38,13+2*(level-1)))
    : size;
  let seed = (Math.imul(level,2654435761) >>> 0) || 1;
  const random = max => {
    seed ^= seed << 13;
    seed ^= seed >>> 17;
    seed ^= seed << 5;
    return (seed >>> 0) % max;
  };
  const mask = extreme ? octopusMask(progressiveSize) : [];
  if (!extreme) for (let y=0;y<progressiveSize;y++) for (let x=0;x<progressiveSize;x++) {
    const row = Math.floor((y+.5)*originalSize/progressiveSize - (originalSize-pixels.length)/2);
    const col = Math.floor((x+.5)*originalSize/progressiveSize - (originalSize-width)/2);
    if (pixels[row]?.[col] === '#') mask.push([x,y]);
  }

  function build() {
    const remaining = new Map(mask.map(cell => [key(...cell),cell]));
    const arrows = [];
    while (remaining.size) {
      const exits = [];
      const minX = Array(progressiveSize).fill(progressiveSize), maxX = Array(progressiveSize).fill(-1);
      const minY = Array(progressiveSize).fill(progressiveSize), maxY = Array(progressiveSize).fill(-1);
      if (extreme) for (const [x,y] of remaining.values()) {
        minX[y] = Math.min(minX[y],x); maxX[y] = Math.max(maxX[y],x);
        minY[x] = Math.min(minY[x],y); maxY[x] = Math.max(maxY[x],y);
      }
      for (const cell of remaining.values()) {
        const [x,y] = cell;
        for (let direction=0;direction<4;direction++) {
          const clear = extreme
            ? [x===maxX[y],y===maxY[x],x===minX[y],y===minY[x]][direction]
            : exitClear([cell],direction,remaining,progressiveSize);
          if (!clear) continue;
          const [dx,dy] = directions[direction];
          exits.push({cell,direction,tail:remaining.get(key(x-dx,y-dy))});
        }
      }
      const longExits = exits.filter(exit => exit.tail);
      const wantShort = layout === 3 ? random(12) < Math.min(6,2+Math.floor(level/3)) : random(5) === 0;
      const choices = !wantShort && longExits.length ? longExits : exits;
      const {cell,direction,tail} = choices[random(choices.length)];
      const cells = [cell];
      remaining.delete(key(...cell));
      if (!wantShort && tail) {
        cells.push(tail);
        remaining.delete(key(...tail));
        const length = 2 + random(layout === 1
          ? (extreme ? 10 : Math.min(9,4+Math.floor(level/3)))
          : (extreme ? Math.min(18,9+level) : Math.min(14,4+Math.floor(level/2))));
        while (cells.length < length) {
          const [x,y] = cells.at(-1);
          const neighbors = directions.map(([dx,dy]) => remaining.get(key(x+dx,y+dy))).filter(Boolean);
          if (!neighbors.length) break;
          const next = neighbors[random(neighbors.length)];
          cells.push(next);
          remaining.delete(key(...next));
        }
      }
      arrows.push({id:arrows.length,cells:cells.reverse(),direction,color:extreme ? (cell[1]<progressiveSize*.48 ? '#b8f4cf' : '#9addc7') : colors[random(colors.length)]});
    }
    return arrows;
  }

  // Prefer boards where most arrows are initially blocked and several moves depend on each other.
  function challenge(arrows) {
    const owners = new Map(arrows.flatMap(arrow => arrow.cells.map(cell => [key(...cell),arrow.id])));
    const depthsForOwners = [];
    const depths = arrows.map(arrow => {
      const [dx,dy] = directions[arrow.direction];
      const [x,y] = arrow.cells.at(-1);
      let depth = 0;
      for (let a=x+dx,b=y+dy;inside(a,b,progressiveSize);a+=dx,b+=dy) {
        const owner = owners.get(key(a,b));
        if (owner !== undefined) depth = Math.max(depth,1+depthsForOwners[owner]);
      }
      depthsForOwners.push(depth);
      return depth;
    });
    return depths.reduce((sum,depth) => sum+depth,0)/arrows.length;
  }

  let arrows = build();
  let score = challenge(arrows);
  for (let attempt=0;attempt<(extreme ? 3 : Math.min(8,2+level));attempt++) {
    const candidate = build();
    const candidateScore = challenge(candidate);
    if (candidateScore > score) {
      arrows = candidate;
      score = candidateScore;
    }
  }
  return {size:progressiveSize,arrows,mask};
}

const byId = id => document.getElementById(id);
const board = byId('board');
const unit = 38;
const pad = 17;
const point = cell => cell.map(value => pad + unit * (value+.5));
const svgNS = 'http://www.w3.org/2000/svg';
function shape(tag, attributes, parent=board) {
  const node = document.createElementNS(svgNS,tag);
  for (const [name,value] of Object.entries(attributes)) node.setAttribute(name,value);
  parent.append(node);
  return node;
}
const extreme = new URLSearchParams(location.search).get('modo') === 'extremo';
const saveKey = extreme ? 'setas-soltas-extreme-v1' : 'setas-soltas-save-v2';
let saved;
try {
  saved = JSON.parse(localStorage.getItem(saveKey));
  if (!saved && !extreme) {
    const previous = JSON.parse(localStorage.getItem('setas-soltas-save-v1'));
    if (previous) saved = {level:previous.level};
  }
} catch {}
let level = Number.isSafeInteger(saved?.level) && saved.level > 0 ? saved.level : 1;
let layout = saved ? ([2,3].includes(saved.layout) ? saved.layout : 1) : 3;
let {size,arrows,mask} = generate(level,extreme,layout);
let best = Math.max(level-1,Number.isSafeInteger(saved?.best) ? saved.best : 0);
if (removedAllOnLoad()) best = Math.max(best,level);
function removedAllOnLoad() {
  const ids = new Set(Array.isArray(saved?.removed) ? saved.removed : []);
  return arrows.every(arrow => ids.has(arrow.id));
}
let removed = new Set(Array.isArray(saved?.removed) ? saved.removed.filter(id => arrows.some(arrow => arrow.id === id)) : []);
const maxHearts = 5;
const previousMax = saved?.maxHearts === 5 ? 5 : 3;
const savedHearts = saved?.hearts;
let hearts = Number.isInteger(savedHearts) && savedHearts >= 0 && savedHearts <= previousMax
  ? savedHearts === 0 ? 0 : savedHearts + maxHearts - previousMax
  : maxHearts;
const number = value => Number.isSafeInteger(value) && value >= 0 ? value : 0;
let score = number(saved?.score);
let record = number(saved?.record);
let combo = number(saved?.combo);
const firstPowerScore = 10000;
const powerScoreStep = 20000;
const powerDuration = 8000;
const powerNames = {ghost:'Fantasma',shield:'Escudo'};
const powerTier = points => Math.max(0,1+Math.floor((points-firstPowerScore)/powerScoreStep));
const perfectBonus = 1000;
let phaseScore = Math.min(score,saved?.phaseScore === undefined ? score : number(saved.phaseScore));
let mistakes = saved?.mistakes === undefined
  ? Number(removed.size > 0 || hearts < maxHearts)
  : number(saved.mistakes);
let phaseBonus = number(saved?.phaseBonus);
let power = Object.hasOwn(powerNames,saved?.power) ? saved.power : '';
let powerTime = Math.min(powerDuration,number(saved?.powerTime));
let holeTurns = Math.min(2,number(saved?.holeTurns));
let treasure = ['available','spent'].includes(saved?.treasure) ? saved.treasure : '';
let loss = saved?.loss === 'treasure' ? 'treasure' : '';
let winReason = ['blast','hole'].includes(saved?.winReason) ? saved.winReason : '';
let showDirections = false;
const chainDuration = 3200;
const chainLimit = 6;
let chainIds = new Set();
let chainTime = 0;
let hinted;
let blocked;
const animations = new Map();
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function save() {
  try { localStorage.setItem(saveKey,JSON.stringify({level,removed:[...removed],hearts,maxHearts,layout,best,score,record,combo,phaseScore,mistakes,phaseBonus,power,powerTime,holeTurns,treasure,loss,winReason})); } catch {}
}
function activeArrows() { return arrows.filter(arrow => !removed.has(arrow.id)); }
function occupiedCells() {
  return new Set(activeArrows().flatMap(arrow => arrow.cells.map(cell => key(...cell))));
}
function finished() { return removed.size === arrows.length || hearts === 0; }
function treasureArrow() {
  if (level < 2 || level % 4 === 0) return undefined;
  return Math.max(0,Math.floor(arrows.length * .58));
}
function holeTarget(active = activeArrows()) {
  const center = (size-1)/2;
  const distance = ({cells}) => {
    const [x,y] = cells.at(-1);
    return (x-center)**2 + (y-center)**2;
  };
  return active.reduce((closest,arrow) => !closest || distance(arrow) < distance(closest) ? arrow : closest, undefined);
}
function addPoints(points) {
  const previousTier = powerTier(score);
  score += points;
  const tier = powerTier(score);
  if (tier > previousTier) {
    power = tier % 2 ? 'ghost' : 'shield';
    powerTime = powerDuration;
  }
}
function updatePower() {
  const active = powerTime > 0 ? power : '';
  const status = byId('powerStatus');
  status.hidden = !active;
  status.textContent = active ? powerNames[active]+' · '+Math.ceil(powerTime/1000)+' s' : '';
  board.closest('.board').dataset.power = active;
  const next = firstPowerScore + powerTier(score)*powerScoreStep;
  byId('nextPower').textContent = active ? '' : 'Próximo poder aos '+next.toLocaleString('pt-BR')+' pts';
}
function canTick() {
  return !finished() && !document.hidden && byId('startScreen').hidden && byId('treasurePanel').hidden;
}
function tickPower(elapsed) {
  if (!powerTime || !canTick()) return;
  const previousSecond = Math.ceil(powerTime/1000);
  powerTime = Math.max(0,powerTime-Math.round(elapsed));
  if (!powerTime) power = '';
  if (Math.ceil(powerTime/1000) !== previousSecond) {
    updatePower();
    save();
  }
}
function addArrowPoints(count) {
  for (let index=0;index<count;index++) {
    combo++;
    addPoints(100 * Math.min(5,1+Math.floor((combo-1)/3)));
  }
}
function chainCandidates(launched, occupied) {
  const without = new Set(occupied);
  for (const cell of launched.cells) without.delete(key(...cell));
  return activeArrows().filter(candidate => candidate.id !== launched.id &&
    !exitClear(candidate.cells,candidate.direction,occupied,size) &&
    exitClear(candidate.cells,candidate.direction,without,size)).slice(0,chainLimit);
}
function updateChain() {
  const status = byId('chainStatus');
  status.hidden = !chainTime;
  status.textContent = chainTime ? 'Toque numa dourada · '+(Math.ceil(chainTime/100)/10).toLocaleString('pt-BR')+' s' : '';
}
function clearChain() {
  chainIds.clear();
  chainTime = 0;
}
function tickChain(elapsed) {
  if (!chainTime || !canTick()) return;
  chainTime = Math.max(0,chainTime-elapsed);
  if (!chainTime) {
    clearChain();
    for (const group of board.querySelectorAll('.chain-ready')) {
      group.classList.remove('chain-ready');
      group.setAttribute('aria-label',group.dataset.label);
    }
  }
  updateChain();
}
function animateImpact(cell,effect) {
  if (!cell) return;
  const [cx,cy] = point(cell);
  const color = effect === 'shield' ? '#88ffda' : '#d7b7ff';
  const ring = shape('circle',{cx,cy,r:unit*.54,fill:color+'35',stroke:color,'stroke-width':4,
    'pointer-events':'none','aria-hidden':'true'});
  ring.style.transformOrigin = cx+'px '+cy+'px';
  if (reducedMotion.matches || !ring.animate) {
    setTimeout(() => ring.remove(),350);
    return;
  }
  ring.animate([{opacity:1,transform:'scale(.5)'},{opacity:0,transform:'scale(2.6)'}],
    {duration:550,fill:'forwards'}).finished.then(() => ring.remove(),() => ring.remove());
}
function winPhase(reason = '') {
  clearChain();
  winReason = reason;
  best = Math.max(best,level);
  phaseBonus = mistakes === 0 ? perfectBonus : 0;
  addPoints(phaseBonus);
  record = Math.max(record,score);
  hearts = maxHearts;
  celebrateWin = true;
}
function redraw() {
  const extent = size * unit + pad * 2;
  board.setAttribute('viewBox','0 0 '+extent+' '+extent);
  board.replaceChildren();
  route = undefined;
  const active = activeArrows();
  if (!extreme) for (const cell of mask) {
    const [cx,cy] = point(cell);
    shape('circle',{cx,cy,r:1.1,fill:'#34473d'});
  }
  if (showDirections || hinted !== undefined) {
    for (const arrow of active.filter(arrow => showDirections || arrow.id === hinted)) {
      const [x,y] = point(arrow.cells.at(-1));
      const [dx,dy] = directions[arrow.direction];
      shape('line',{x1:x,y1:y,x2:dx ? (dx>0 ? extent-7 : 7) : x,
        y2:dy ? (dy>0 ? extent-7 : 7) : y,stroke:arrow.color,
        opacity:arrow.id === hinted ? .85 : .28,'stroke-dasharray':'3 5'});
    }
  }
  if (holeTurns) {
    const center = pad+unit*size/2;
    shape('circle',{cx:center,cy:center,r:unit*.43,fill:'#07050f',stroke:'#bb83ff','stroke-width':3});
  }
  const target = holeTurns ? holeTarget(active)?.id : undefined;
  for (const arrow of active) {
    const label = 'Seta '+(arrow.id+1)+' para '+directionNames[arrow.direction];
    const chained = chainIds.has(arrow.id);
    const group = shape('g',{class:'arrow'+(arrow.id===hinted?' hint':'')+(arrow.id===blocked?' blocked':'')+(chained?' chain-ready':''),
      role:'button',tabindex:finished()?-1:0,'aria-label':label+(chained?' · ativa reação em cadeia':'')});
    group.dataset.label = label;
    group.style.color = arrow.color;
    const points = arrowPoints(arrow);
    shape('polyline',{points:pointList(points),fill:'none',stroke:'transparent','stroke-width':34,'stroke-linecap':'round','stroke-linejoin':'round'},group);
    drawInk(group,points,arrow.direction);
    if ((arrow.id === treasureArrow() && !treasure) || arrow.id === target) {
      const [cx,cy] = point(arrow.cells[0]);
      shape('circle',{cx,cy,r:6,fill:arrow.id === target ? '#bb83ff' : '#ffda83',
        stroke:'#101c19','stroke-width':2,'pointer-events':'none'},group);
    }
    if (arrow.id === blocked) group.animate?.([{opacity:.4},{opacity:1},{opacity:.5},{opacity:1}],{duration:240});
    bindArrow(group,arrow);
  }
  for (const {group} of animations.values()) board.append(group);
  updateStatus();
}
let route;
function previewRoute(arrow) {
  if (finished() || removed.has(arrow.id)) return;
  route?.remove();
  const occupied = occupiedCells();
  const cell = firstObstacle(arrow.cells,arrow.direction,occupied,size);
  const ghost = cell && power === 'ghost' && powerTime > 0;
  const stop = ghost ? undefined : cell;
  const [x,y] = arrowPoints(arrow).at(-1);
  const [dx,dy] = directions[arrow.direction];
  const extent = size*unit+pad*2;
  const [endX,endY] = stop ? point(stop) : [
    dx ? (dx>0 ? extent-8 : 8) : x,
    dy ? (dy>0 ? extent-8 : 8) : y
  ];
  const color = ghost ? '#d7b7ff' : stop ? '#ff9c7d' : '#daf58a';
  route = shape('g',{'pointer-events':'none','aria-hidden':'true'});
  shape('line',{x1:x,y1:y,x2:endX,y2:endY,stroke:color,'stroke-width':extreme?8:4,
    'stroke-linecap':'round','stroke-dasharray':extreme?'10 12':'5 7'},route);
  shape('circle',{cx:endX,cy:endY,r:extreme?15:8,fill:stop?'#172421':color,stroke:color,
    'stroke-width':extreme?5:2},route);
  if (stop) {
    const cross = extreme ? 6 : 3;
    shape('path',{d:'M '+(endX-cross)+' '+(endY-cross)+' l '+(2*cross)+' '+(2*cross)+
      ' M '+(endX+cross)+' '+(endY-cross)+' l '+(-2*cross)+' '+(2*cross),
      stroke:color,'stroke-width':extreme?4:2},route);
  }
  const count = stop ? 0 : chainCandidates(arrow,occupied).length;
  message(chainIds.has(arrow.id) ? 'Esta seta dispara a cadeia.'
    : count >= 2 ? 'Esta jogada destrava '+count+' setas para uma cadeia.'
    : ghost ? 'O Fantasma atravessa o bloqueio.'
    : stop ? 'A seta bate no ponto marcado.' : 'Caminho livre até a borda.');
}

function bindArrow(group,arrow) {
  let press;
  let suppressClick = false;
  function stopPress() {
    clearTimeout(press?.timer);
    press = undefined;
  }
  group.addEventListener('pointerdown', event => {
    if (!event.isPrimary || event.button !== 0 || finished()) return;
    stopPress();
    suppressClick = false;
    route?.remove();
    press = {id:event.pointerId,x:event.clientX,y:event.clientY};
    press.timer = setTimeout(() => {
      suppressClick = true;
      previewRoute(arrow);
    },380);
  });
  group.addEventListener('pointermove', event => {
    if (press?.id !== event.pointerId) return;
    if (Math.hypot(event.clientX-press.x,event.clientY-press.y)>10) {
      suppressClick = true;
      stopPress();
    }
  });
  for (const type of ['pointerup','pointercancel','pointerleave']) {
    group.addEventListener(type,event => {
      if (press?.id === event.pointerId) stopPress();
    });
  }
  group.addEventListener('click',() => {
    if (!suppressClick) play(arrow);
    suppressClick = false;
  });
  group.addEventListener('keydown',event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    if (event.shiftKey) previewRoute(arrow);
    else play(arrow);
  });
}
board.addEventListener('contextmenu',event => event.preventDefault());

let celebrateWin = false;
let blastTimer = 0;
function celebratePhase() {
  const layer = byId('confetti');
  layer.replaceChildren();
  byId('result').classList.add('celebrating');
  if (reducedMotion.matches) return;
  const radius = layer.clientWidth * .65;
  for (let i=0;i<72;i++) {
    const angle = i*2.39996;
    const distance = radius*(.42+(i%7)/12);
    const piece = document.createElement('i');
    const burst = Math.floor(i/24);
    piece.style.setProperty('--left',[ '50%','17%','83%' ][burst]);
    piece.style.setProperty('--top',burst === 0 ? '44%' : '70%');
    piece.style.setProperty('--width',5+i%7+'px');
    piece.style.setProperty('--height',8+i%9+'px');
    piece.style.setProperty('--time',1.1+(i%6)*.12+'s');
    piece.style.setProperty('--delay',burst*.22+'s');
    piece.style.setProperty('--x',Math.cos(angle)*distance+'px');
    piece.style.setProperty('--y',Math.sin(angle)*distance+'px');
    piece.style.setProperty('--spin',(i%2 ? -1 : 1)*(160+37*i)+'deg');
    piece.style.setProperty('--color',colors[i%colors.length]);
    piece.addEventListener('animationend',() => piece.remove(),{once:true});
    layer.append(piece);
  }
}
function updateStatus() {
  const active = activeArrows();
  byId('level').textContent = 'Fase '+level;
  byId('count').textContent = active.length+(active.length===1?' seta':' setas');
  byId('hearts').textContent = '♥'.repeat(hearts)+'♡'.repeat(maxHearts-hearts);
  byId('hearts').setAttribute('aria-label',hearts+' de '+maxHearts+' vidas');
  byId('progress').max = arrows.length;
  byId('progress').value = removed.size;
  byId('guide').disabled = byId('hint').disabled = finished();
  byId('result').hidden = !finished() || (hearts > 0 && (animations.size > 0 || blastTimer));
  byId('score').textContent = score.toLocaleString('pt-BR')+' pts';
  byId('record').textContent = 'Recorde '+record.toLocaleString('pt-BR');
  byId('combo').textContent = combo ? 'Combo '+combo+' · ×'+Math.min(5,1+Math.floor((combo-1)/3)) : '';
  byId('viewTreasure').hidden = treasure !== 'available' || finished();
  updatePower();
  updateChain();
  const won = hearts > 0 && active.length === 0;
  byId('restart').disabled = won;
  byId('result').classList.toggle('is-win',won);
  byId('winMark').hidden = !won;
  byId('roundSummary').hidden = false;
  byId('roundSummary').textContent = won
    ? [winReason === 'blast' ? 'Explosão total!' : '',
      phaseBonus ? 'Fase perfeita +' + phaseBonus.toLocaleString('pt-BR')+' pts' : '',
      powerTime ? powerNames[power]+' · '+Math.ceil(powerTime/1000)+' s restantes' : '',
      score.toLocaleString('pt-BR')+' pts'].filter(Boolean).join(' · ')
    : 'Fase '+level+' · '+score.toLocaleString('pt-BR')+' pts';
  byId('resultTitle').textContent = won ? 'Fase '+level+' concluída!' : loss ? 'O baú levou tudo' : 'Acabaram as vidas';
  byId('continue').textContent = won ? 'Próxima fase' : 'Tentar fase de novo';
  if (celebrateWin && !byId('result').hidden) {
    celebrateWin = false;
    celebratePhase();
  }
}
function pointList(points) { return points.map(pair => pair.join(',')).join(' '); }

function arrowPoints(arrow) {
  const points = arrow.cells.map(point);
  const [x,y] = points.at(-1);
  const [dx,dy] = directions[arrow.direction];
  if (points.length === 1) points.unshift([x-dx*10,y-dy*10]);
  points.push([x+dx*10,y+dy*10]);
  return points;
}

function arrowhead(tip,direction) {
  const [dx,dy] = directions[direction];
  const wing = side => [tip[0]-dx*9-dy*side*6,tip[1]-dy*9+dx*side*6];
  return [wing(1),tip,wing(-1)];
}

function drawInk(group,points,direction) {
  const style = {class:'ink','stroke-width':extreme ? 5.5 : 4.4,'pointer-events':'none'};
  const depth = {...style,class:'ink depth',opacity:.6,transform:'translate(1 2)',
    style:'stroke:#060d0b;stroke-width:7'};
  const shadow = shape('polyline',{...depth,points:pointList(points)},group);
  const shadowHead = shape('polyline',{...depth,points:pointList(arrowhead(points.at(-1),direction))},group);
  return [
    shape('polyline',{...style,points:pointList(points)},group),
    shape('polyline',{...style,points:pointList(arrowhead(points.at(-1),direction))},group),shadow,shadowHead
  ];
}

function animateExit(arrow,effect = '',delay = 0) {
  const points = arrowPoints(arrow);
  const tip = points.at(-1);
  const [dx,dy] = directions[arrow.direction];
  const extent = size*unit+pad*2;
  const exitDistance = dx > 0 ? extent-tip[0] : dx < 0 ? tip[0] : dy > 0 ? extent-tip[1] : tip[1];
  const distance = exitDistance+12;
  const path = [...points,[tip[0]+dx*distance,tip[1]+dy*distance]];
  const offsets = [0];
  for (let i=1;i<path.length;i++) {
    offsets.push(offsets.at(-1)+Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]));
  }
  const length = offsets.at(-2);
  const travel = distance+length;
  const duration = reducedMotion.matches ? 420 : Math.min(1100,620+travel*.48);
  const group = shape('g',{class:'arrow'+(effect?' '+effect+'-flight':''),'pointer-events':'none','aria-hidden':'true'});
  group.style.color = arrow.color;
  const [body,head,shadow,shadowHead] = drawInk(group,points,arrow.direction);
  const animation = {group,frame:0};
  animations.set(arrow.id,animation);
  let start;

  function at(offset) {
    const index = offsets.findIndex(value => value >= offset);
    if (index <= 0) return path[index === 0 ? 0 : path.length-1];
    const fraction = (offset-offsets[index-1])/(offsets[index]-offsets[index-1]);
    return path[index-1].map((value,axis) => value+fraction*(path[index][axis]-value));
  }

  function frame(now) {
    start ??= now+(reducedMotion.matches ? 0 : delay);
    const progress = Math.min(1,Math.max(0,(now-start)/duration));
    const advance = travel*progress*(.65+.35*progress);
    if (progress === 1) {
      group.remove();
      animations.delete(arrow.id);
      updateStatus();
      if (finished() && !byId('result').hidden) byId('continue').focus();
      return;
    }
    const front = Math.min(offsets.at(-1),length+advance);
    const visible = [at(advance),...path.filter((_,i) => offsets[i]>advance && offsets[i]<front),at(front)];
    const bodyPoints = pointList(visible);
    const headPoints = pointList(arrowhead(visible.at(-1),arrow.direction));
    for (const ink of [body,shadow]) ink.setAttribute('points',bodyPoints);
    for (const ink of [head,shadowHead]) ink.setAttribute('points',headPoints);
    animation.frame = requestAnimationFrame(frame);
  }
  animation.frame = requestAnimationFrame(frame);
}

function message(text) { byId('message').textContent = text; }
function advanceHole() {
  if (!holeTurns || --holeTurns) return false;
  const target = holeTarget();
  if (!target) return false;
  removed.add(target.id);
  if (target.id === treasureArrow() && !treasure) treasure = 'available';
  addArrowPoints(1);
  return true;
}
function releaseArrow(arrow,effect,delay) {
  removed.add(arrow.id);
  if (arrow.id === treasureArrow() && !treasure) treasure = 'available';
  addArrowPoints(1);
  animateExit(arrow,effect,delay);
}
function play(arrow) {
  if (finished() || !byId('treasurePanel').hidden || removed.has(arrow.id)) return;
  hinted = blocked = undefined;
  const occupied = occupiedCells();
  const obstacle = firstObstacle(arrow.cells,arrow.direction,occupied,size);
  const ghost = obstacle && power === 'ghost' && powerTime > 0;
  const shield = obstacle && power === 'shield' && powerTime > 0;
  const chain = chainIds.has(arrow.id)
    ? [arrow,...activeArrows().filter(candidate => candidate !== arrow && chainIds.has(candidate.id))]
    : [];
  clearChain();
  let notice = '';
  if (chain.length > 1) {
    const hadTreasure = treasure;
    chain.forEach((candidate,index) => releaseArrow(candidate,'chain',index*110));
    const bonus = chain.length*250;
    addPoints(bonus);
    notice = 'Reação em cadeia! '+chain.length+' setas · +'+bonus+' pts';
    if (!hadTreasure && treasure) notice += '. Você encontrou um baú.';
  } else if (!obstacle || ghost) {
    const candidates = chainCandidates(arrow,occupied);
    const hadTreasure = treasure;
    releaseArrow(arrow,ghost?'ghost':'');
    if (ghost) notice = 'O Fantasma atravessou o bloqueio.';
    if (!hadTreasure && treasure) notice += (notice ? ' ' : '')+'Você encontrou um baú.';
    if (candidates.length >= 2) {
      chainIds = new Set(candidates.map(candidate => candidate.id));
      chainTime = chainDuration;
      if (!notice) notice = 'Setas douradas liberadas. Toque numa para disparar a cadeia!';
    }
  } else {
    blocked = arrow.id;
    mistakes++;
    if (shield) {
      notice = 'O Escudo segurou o impacto.';
    } else {
      hearts--;
      combo = 0;
      notice = 'Tem outra seta no caminho.';
    }
  }
  if (hearts > 0) {
    const swallowed = advanceHole();
    if (swallowed) {
      const openChain = activeArrows().filter(candidate => chainIds.has(candidate.id));
      if (openChain.length < 2) clearChain();
      notice += (notice ? ' ' : '')+'O buraco negro puxou a seta marcada.';
    } else if (holeTurns && !notice) notice = 'O buraco negro vai puxar a seta marcada na próxima jogada.';
    if (removed.size === arrows.length) winPhase(swallowed ? 'hole' : '');
  } else clearChain();
  message(notice);
  save();
  redraw();
  if (ghost || shield) animateImpact(obstacle,ghost?'ghost':'shield');
  if (finished() && !byId('result').hidden) byId('continue').focus();
}
function showTreasure(open) {
  byId('treasurePanel').hidden = !open;
  if (open) byId('openTreasure').focus();
  else byId('viewTreasure').focus();
}
function openTreasure() {
  if (finished() || treasure !== 'available') return;
  showTreasure(false);
  treasure = 'spent';
  const chance = Math.random();
  if (chance < .10) {
    const remaining = activeArrows();
    addArrowPoints(remaining.length);
    for (const arrow of remaining) removed.add(arrow.id);
    winPhase('blast');
    const stage = board.closest('.board');
    stage.classList.add('blast');
    if (!reducedMotion.matches) {
      const fragments = remaining.map((arrow,index) => {
        const group = shape('g',{class:'arrow','pointer-events':'none','aria-hidden':'true'});
        group.style.color = arrow.color;
        drawInk(group,arrowPoints(arrow),arrow.direction);
        group.animate?.([{opacity:1},{opacity:0,transform:'translate('+((index%9-4)*11)+'px,'+((index%7-3)*14)+'px)'}],
          {duration:280,delay:index%9*22,fill:'forwards'});
        return group;
      });
      blastTimer = setTimeout(() => {
        blastTimer = 0;
        fragments.forEach(group => group.remove());
        updateStatus();
        byId('continue').focus();
      },490);
      save();
      redraw();
      fragments.forEach(group => board.append(group));
      message('Explosão total! Todas as setas foram liberadas.');
      return;
    }
    message('Explosão total! Todas as setas foram liberadas.');
  } else if (chance < .15) {
    hearts = score = phaseScore = combo = powerTime = holeTurns = 0;
    power = '';
    clearChain();
    loss = 'treasure';
    message('O baú levou as vidas, os pontos e o poder desta partida.');
  } else if (chance < .33) {
    holeTurns = 2;
    message('Buraco negro! Em duas jogadas ele puxa a seta marcada.');
  } else if (chance < .57 && hearts < maxHearts) {
    hearts++;
    message('Você ganhou uma vida!');
  } else if (chance < .83) {
    addPoints(500);
    message('Você ganhou 500 pontos!');
  } else {
    combo = 0;
    message('O baú zerou seu combo.');
  }
  save();
  redraw();
  (finished() ? byId('continue') : byId('hint')).focus();
}
function reset(nextLevel) {
  for (const {frame} of animations.values()) cancelAnimationFrame(frame);
  animations.clear();
  clearTimeout(blastTimer);
  blastTimer = 0;
  celebrateWin = false;
  byId('confetti').replaceChildren();
  byId('result').classList.remove('celebrating');
  byId('treasurePanel').hidden = true;
  board.closest('.board').classList.remove('blast');
  if (nextLevel === level) {
    score = phaseScore;
    combo = powerTime = 0;
    power = '';
  } else {
    layout = 3;
  }
  hearts = maxHearts;
  phaseScore = score;
  mistakes = phaseBonus = 0;
  level = nextLevel;
  ({size,arrows,mask} = generate(level,extreme,layout));
  removed = new Set();
  clearChain();
  treasure = loss = winReason = '';
  holeTurns = 0;
  blocked = hinted = undefined;
  save();
  redraw();
  message('Toque para soltar. Segure uma seta para conferir o caminho.');
}
let zoom = 1;
function setZoom(value) {
  const viewport = byId('boardScroll');
  const previous = zoom;
  const centerX = (viewport.scrollLeft+viewport.clientWidth/2)/previous;
  const centerY = (viewport.scrollTop+viewport.clientHeight/2)/previous;
  zoom = value;
  board.style.width = zoom*100+'%';
  viewport.scrollLeft = centerX*zoom-viewport.clientWidth/2;
  viewport.scrollTop = centerY*zoom-viewport.clientHeight/2;
  byId('zoomValue').value = zoom*100+'%';
  byId('zoomOut').disabled = zoom === 1;
  byId('zoomIn').disabled = zoom === 3;
}
byId('zoomOut').onclick = () => setZoom(Math.max(1,zoom-.5));
byId('zoomIn').onclick = () => setZoom(Math.min(3,zoom+.5));
byId('zoomOut').disabled = true;
byId('start').onclick = () => {
  byId('startScreen').hidden = true;
  document.documentElement.classList.add('immersive');
  if (document.fullscreenEnabled && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  if (!byId('result').hidden) byId('continue').focus();
};
byId('mode').setAttribute('aria-pressed',extreme);
byId('mode').textContent = extreme ? 'Clássico' : 'Extremo';
byId('mode').onclick = () => {
  const url = new URL(location.href);
  if (extreme) url.searchParams.delete('modo');
  else url.searchParams.set('modo','extremo');
  location.assign(url);
};
byId('restart').onclick = () => {
  if (removed.size === arrows.length) return;
  if (!hearts || confirm('Recomeçar esta fase com o tabuleiro inteiro?')) reset(level);
};
byId('continue').onclick = () => reset(hearts > 0 ? level+1 : level);
byId('viewTreasure').onclick = () => showTreasure(true);
byId('skipTreasure').onclick = () => showTreasure(false);
byId('openTreasure').onclick = openTreasure;
byId('guide').onclick = () => {
  showDirections = !showDirections;
  byId('guide').setAttribute('aria-pressed',showDirections);
  byId('guide').textContent = showDirections ? 'Ocultar direções' : 'Ver direções';
  redraw();
};
byId('hint').onclick = () => {
  const occupied = occupiedCells();
  const arrow = activeArrows().find(candidate => exitClear(candidate.cells,candidate.direction,occupied,size));
  if (!arrow) return;
  hinted = arrow.id;
  blocked = undefined;
  message('A seta iluminada tem caminho livre.');
  redraw();
};
redraw();
message('Toque para soltar. Segure uma seta para conferir o caminho.');
let lastPowerTick = performance.now();
setInterval(() => {
  const now = performance.now();
  tickPower(now-lastPowerTick);
  tickChain(now-lastPowerTick);
  lastPowerTick = now;
},100);
document.addEventListener('visibilitychange',() => { lastPowerTick = performance.now(); });
window.addEventListener('pagehide',save);
</script>
</body>
